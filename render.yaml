services:
  - type: web
    name: devconnector
    runtime: node
    plan: free
    buildCommand: npm install && NPM_CONFIG_PRODUCTION=false npm install --prefix client && npm run build --prefix client
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
